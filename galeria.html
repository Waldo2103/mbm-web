<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería — MBM</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: var(--navy);
      color: var(--white);
      font-family: var(--f-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: var(--pad-y) var(--pad-x);
    }

    .galeria__titulo {
      font-family: var(--f-display);
      font-weight: 900;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
      margin: 0;
    }

    /* — CARRUSEL — */
    .carousel {
      position: relative;
      width: min(100%, 760px);
      overflow: hidden;
      border-radius: 4px;
    }

    .carousel__track {
      display: flex;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .carousel__slide {
      flex: 0 0 100%;
      aspect-ratio: 16 / 9;
      background: #2c3260;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--f-serif);
      font-size: 1.1rem;
      font-style: italic;
      color: rgba(255,255,255,0.35);
      user-select: none;
    }

    .carousel__slide:nth-child(2) { background: #222647; }
    .carousel__slide:nth-child(3) { background: #1a1e3a; }

    /* flechas */
    .carousel__btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: var(--red);
      border: none;
      color: var(--white);
      font-size: 1.25rem;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 2;
    }
    .carousel__btn:hover { background: #8c1412; }
    .carousel__btn--prev { left: .75rem; }
    .carousel__btn--next { right: .75rem; }

    /* dots */
    .carousel__dots {
      display: flex;
      gap: .5rem;
      justify-content: center;
      margin-top: .75rem;
    }
    .carousel__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s;
    }
    .carousel__dot.active { background: var(--red); }

    /* texto */
    .galeria__texto {
      font-family: var(--f-display);
      font-weight: 600;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: center;
      color: var(--cream);
      margin: 0;
    }

    /* botón volver */
    .btn-volver {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: transparent;
      color: var(--white);
      border: 2px solid var(--red);
      padding: .6rem 1.8rem;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-volver:hover {
      background: var(--red);
    }
  </style>
</head>
<body>

  <h1 class="galeria__titulo">Galería</h1>

  <div class="carousel" role="region" aria-label="Galería de imágenes">
    <div class="carousel__track" id="track">
      <div class="carousel__slide">Imagen 1</div>
      <div class="carousel__slide">Imagen 2</div>
      <div class="carousel__slide">Imagen 3</div>
    </div>

    <button class="carousel__btn carousel__btn--prev" id="prev" aria-label="Anterior">&#8592;</button>
    <button class="carousel__btn carousel__btn--next" id="next" aria-label="Siguiente">&#8594;</button>
  </div>

  <div class="carousel__dots" id="dots">
    <button class="carousel__dot active" aria-label="Slide 1"></button>
    <button class="carousel__dot"        aria-label="Slide 2"></button>
    <button class="carousel__dot"        aria-label="Slide 3"></button>
  </div>

  <p class="galeria__texto">Movete Boedo Movete</p>

  <button class="btn-volver" onclick="history.back()">Volver</button>

  <script>
    const track  = document.getElementById('track');
    const dots   = document.querySelectorAll('.carousel__dot');
    const total  = 3;
    let current  = 0;

    function goTo(index) {
      current = (index + total) % total;
      track.style.transform = `translateX(-${current * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
    }

    document.getElementById('prev').addEventListener('click', () => goTo(current - 1));
    document.getElementById('next').addEventListener('click', () => goTo(current + 1));
    dots.forEach((d, i) => d.addEventListener('click', () => goTo(i)));
  </script>

</body>
</html>
