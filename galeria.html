<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería — MBM</title>

  <link rel="preload" href="recursos/BARLOW/Barlow-Black.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="recursos/BARLOW/Barlow-Medium.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/style.css">

  <style>
    body { background: var(--cream); color: var(--navy); min-height: 100vh; }

    /* ── nav ─────────────────────────────────── */
    .doc-nav {
      position: sticky; top: 0; z-index: 900;
      background: var(--navy);
      display: flex; align-items: center;
      height: 56px; padding: 0 var(--pad-x); gap: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .doc-nav__back {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--f-display); font-weight: 700;
      font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.6); text-decoration: none;
      transition: color 0.2s; flex-shrink: 0;
    }
    .doc-nav__back::before { content: '←'; font-size: 14px; }
    .doc-nav__back:hover { color: var(--white); }
    .doc-nav__divider { width: 1px; height: 24px; background: rgba(255,255,255,0.12); }
    .doc-nav__label {
      font-family: var(--f-display); font-weight: 600;
      font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    /* ── hero ────────────────────────────────── */
    .gal-hero {
      background: var(--navy); color: var(--white);
      padding: clamp(40px, 6vw, 72px) var(--pad-x) clamp(32px, 4vw, 56px);
    }
    .gal-hero__inner { max-width: 1100px; margin: 0 auto; }
    .gal-hero__overline {
      font-family: var(--f-display); font-weight: 600;
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--red); margin-bottom: 16px; display: block;
    }
    .gal-hero__title {
      font-family: var(--f-display); font-weight: 900;
      font-size: clamp(36px, 6vw, 80px);
      line-height: 0.92; text-transform: uppercase; color: var(--white); margin: 0;
    }
    .gal-hero__title em {
      display: block; font-family: var(--f-serif); font-style: italic;
      font-weight: 700; font-size: clamp(32px, 5.2vw, 72px);
      color: var(--red); text-transform: none; margin-top: 4px;
    }
    .gal-hero__sub {
      margin-top: clamp(16px, 2vw, 24px);
      font-family: var(--f-body); font-weight: 500;
      font-size: clamp(13px, 1.3vw, 15px); line-height: 1.7;
      color: rgba(255,255,255,0.5);
    }

    /* ── galería masonry ─────────────────────── */
    .gal-wrap {
      max-width: 1400px; margin: 0 auto;
      padding: clamp(32px, 5vw, 64px) var(--pad-x) clamp(48px, 6vw, 80px);
    }

    .gal-grid {
      columns: 3 280px;
      column-gap: 10px;
    }

    .gal-item {
      break-inside: avoid;
      margin-bottom: 10px;
      display: block;
      overflow: hidden;
      background: var(--navy);
    }

    .gal-item img {
      width: 100%;
      display: block;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s;
      opacity: 0;
    }

    .gal-item img.loaded { opacity: 1; }
    .gal-item:hover img { transform: scale(1.03); }

    /* ── lightbox ────────────────────────────── */
    .lightbox {
      display: none;
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(10,12,30,0.96);
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }

    .lightbox__img {
      max-width: 100%; max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }

    .lightbox__close {
      position: fixed; top: 20px; right: 24px;
      font-family: var(--f-display); font-weight: 900;
      font-size: 28px; color: rgba(255,255,255,0.7);
      background: none; border: none; cursor: pointer;
      line-height: 1; transition: color 0.2s;
    }
    .lightbox__close:hover { color: var(--white); }

    .lightbox__nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: var(--red); border: none;
      color: var(--white); font-size: 20px;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s;
    }
    .lightbox__nav:hover { background: #8c1412; }
    .lightbox__nav--prev { left: 16px; }
    .lightbox__nav--next { right: 16px; }

    .lightbox__counter {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-family: var(--f-display); font-weight: 700;
      font-size: 11px; letter-spacing: 0.16em;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 600px) {
      .gal-grid { columns: 2 160px; column-gap: 6px; }
      .gal-item { margin-bottom: 6px; }
      .doc-nav__label { display: none; }
      .lightbox__nav { display: none; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="doc-nav">
    <a href="javascript:history.back()" class="doc-nav__back">Volver</a>
    <div class="doc-nav__divider"></div>
    <span class="doc-nav__label">Galería fotográfica</span>
  </nav>

  <!-- HERO -->
  <header class="gal-hero">
    <div class="gal-hero__inner">
      <span class="gal-hero__overline">◆ Movete Boedo Movete · 2026</span>
      <h1 class="gal-hero__title">
        Todos 
        <em>los días.</em>
      </h1>
      <p class="gal-hero__sub">todo el tiempo y en todos los ámbitos.</p>
    </div>
  </header>

  <!-- GALERÍA -->
  <div class="gal-wrap">
    <div class="gal-grid" id="galGrid">

      <a class="gal-item" href="#" data-idx="0">
        <img src="recursos/galeria/1.webp" alt="MBM lanzamiento — foto 1" loading="eager">
      </a>
      <a class="gal-item" href="#" data-idx="1">
        <img src="recursos/galeria/2.webp" alt="MBM lanzamiento — foto 2" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="2">
        <img src="recursos/galeria/3.webp" alt="MBM lanzamiento — foto 3" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="3">
        <img src="recursos/galeria/4.webp" alt="MBM lanzamiento — foto 4" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="4">
        <img src="recursos/galeria/5.webp" alt="MBM lanzamiento — foto 5" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="5">
        <img src="recursos/galeria/6-1.webp" alt="MBM lanzamiento — foto 6" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="6">
        <img src="recursos/galeria/6-2.webp" alt="MBM lanzamiento — foto 7" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="7">
        <img src="recursos/galeria/7.webp" alt="MBM lanzamiento — foto 8" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="8">
        <img src="recursos/galeria/8.webp" alt="MBM lanzamiento — foto 9" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="9">
        <img src="recursos/galeria/9.webp" alt="MBM lanzamiento — foto 10" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="10">
        <img src="recursos/galeria/10.webp" alt="MBM lanzamiento — foto 11" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="11">
        <img src="recursos/galeria/11.webp" alt="MBM lanzamiento — foto 12" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="12">
        <img src="recursos/galeria/12.webp" alt="MBM lanzamiento — foto 13" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="13">

      <a class="gal-item" href="#" data-idx="14">

      <a class="gal-item" href="#" data-idx="15">

      </a>
      <a class="gal-item" href="#" data-idx="16">
        <img src="recursos/galeria/16.webp" alt="MBM lanzamiento — foto 17" loading="lazy">
      </a>
      <a class="gal-item" href="#" data-idx="17">
        <img src="recursos/galeria/17.webp" alt="MBM lanzamiento — foto 18" loading="lazy">
      </a>

    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <button class="lightbox__close" id="lbClose" aria-label="Cerrar">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Anterior">←</button>
    <img class="lightbox__img" id="lbImg" src="" alt="">
    <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Siguiente">→</button>
    <span class="lightbox__counter" id="lbCounter"></span>
  </div>

  <script>
    // Fade-in al cargar cada imagen
    document.querySelectorAll('.gal-item img').forEach(img => {
      if (img.complete) {
        img.classList.add('loaded');
      } else {
        img.addEventListener('load', () => img.classList.add('loaded'));
      }
    });

    // Lightbox
    const items   = Array.from(document.querySelectorAll('.gal-item'));
    const lb      = document.getElementById('lightbox');
    const lbImg   = document.getElementById('lbImg');
    const lbCounter = document.getElementById('lbCounter');
    const total   = items.length;
    let current   = 0;

    const srcs = items.map(a => a.querySelector('img').src);

    function openLb(idx) {
      current = (idx + total) % total;
      lbImg.src = srcs[current];
      lbImg.alt = items[current].querySelector('img').alt;
      lbCounter.textContent = `${current + 1} / ${total}`;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLb() {
      lb.classList.remove('open');
      lbImg.src = '';
      document.body.style.overflow = '';
    }

    items.forEach((a, i) => {
      a.addEventListener('click', e => { e.preventDefault(); openLb(i); });
    });

    document.getElementById('lbClose').addEventListener('click', closeLb);
    document.getElementById('lbPrev').addEventListener('click', () => openLb(current - 1));
    document.getElementById('lbNext').addEventListener('click', () => openLb(current + 1));

    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLb();
      if (e.key === 'ArrowLeft')   openLb(current - 1);
      if (e.key === 'ArrowRight')  openLb(current + 1);
    });
  </script>

</body>
</html>
